<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier des fractions</title>
<link rel="stylesheet" href="../style.css">
<style>
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

  header { display: flex; align-items: center; gap: 1.5rem; padding: 0.8rem 1.5rem; flex-wrap: wrap; }
  header a { color: inherit; text-decoration: none; font-size: 1.4rem; }
  .controls { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-left: auto; }
  .controls label { display: flex; align-items: center; gap: 0.4rem; font-weight: 600; }
  .controls input[type="number"] {
    width: 3.6rem; font: inherit; font-weight: 700; font-size: 1.15rem; text-align: center;
    padding: 0.3rem; border: 2px solid var(--ink); border-radius: 0.6rem;
  }
  .swatches { display: flex; gap: 0.35rem; }
  .swatches button { width: 1.9rem; height: 1.9rem; padding: 0; border-radius: 50%; border: 3px solid transparent; }
  .swatches button[aria-pressed="true"] { border-color: var(--ink); }
  .sep { width: 2px; align-self: stretch; background: #d8d4ca; }

  #stage { position: relative; flex: 1; min-height: 0; touch-action: none; overflow: auto; }
  #spacer { position: absolute; width: 1px; height: 1px; pointer-events: none; }
  .zoom { display: flex; align-items: center; gap: 0.3rem; }
  .zoom #zoom-reset { min-width: 4.2rem; padding-inline: 0.4rem; }
  #empty[hidden] { display: none; }
  #empty { position: absolute; inset: 0; display: grid; place-items: center; color: #8a8578; font-size: 1.3rem; pointer-events: none; }

  .item { position: absolute; }
  .item .svg { width: 100%; height: 100%; }
  .item .svg svg { display: block; }
  .item.fill .svg { cursor: crosshair; }
  .item.dragging { filter: drop-shadow(0 8px 16px rgb(0 0 0 / 0.25)); }
  .item.animating { transition: left 300ms cubic-bezier(0.22, 1, 0.36, 1), top 300ms cubic-bezier(0.22, 1, 0.36, 1); }

  .bar {
    position: absolute; left: 0; right: 0; height: var(--bar-h);
    display: flex; align-items: center; justify-content: space-between; gap: 0.3rem;
    font-size: calc(var(--unit) * 0.06); font-weight: 700; white-space: nowrap;
    cursor: grab; user-select: none; touch-action: none;
  }
  .item.base .bar { top: 100%; }
  .item.fill .bar { bottom: calc(100% + var(--bar-offset, 0px)); }
  .item.dragging .bar { cursor: grabbing; }
  .bar .grip { opacity: 0.45; font-size: 1.2em; padding: 0 0.2em; }
  .bar .more {
    border: none; background: none; padding: 0 0.3em; font-size: 1.3em; line-height: 1; opacity: 0.5; cursor: pointer;
  }
  .bar .more:hover { opacity: 1; }

  #menu {
    max-height: calc(100dvh - 16px); overflow: auto;
    position: fixed; z-index: 100000; display: flex; flex-direction: column; gap: 0.7rem;
    padding: 0.9rem 1rem; background: #fff; border: 2px solid var(--ink); border-radius: 0.8rem;
    box-shadow: 0 10px 30px rgb(0 0 0 / 0.15); font-weight: 600;
  }
  #menu[hidden] { display: none; }
  #menu .row { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
  #menu output { min-width: 1.8em; text-align: center; font-size: 1.2rem; }
  #menu .actions { display: flex; gap: 0.5rem; }
  #menu .danger { border-color: #c0392b; color: #c0392b; }

  .group-label {
    position: absolute; display: flex; justify-content: center; align-items: center; gap: 0.4em;
    font-weight: 700; white-space: nowrap; pointer-events: none;
    font-size: calc(var(--unit) * 0.075);
  }
  .frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.05; vertical-align: middle; }
  .frac span:first-child { border-bottom: 0.08em solid currentColor; padding: 0 0.15em; }
</style>
</head>
<body>
<header>
  <a href="../" aria-label="Retour aux activités">←</a>
  <h1>Atelier des fractions</h1>
  <div class="controls">
    <label>Colonnes <input id="cols" type="number" min="1" max="20" value="10"></label>
    <label>Lignes <input id="rows" type="number" min="1" max="20" value="1"></label>
    <button id="add-base">+ Grille vide</button>
    <span class="sep"></span>
    <div class="swatches" id="swatches" aria-label="Couleur"></div>
    <button id="add-fill">+ Grille à remplir</button>
    <span class="sep"></span>
    <div class="zoom" aria-label="Zoom">
      <button id="zoom-out" aria-label="Dézoomer">−</button>
      <button id="zoom-reset" title="Taille normale"></button>
      <button id="zoom-in" aria-label="Zoomer">+</button>
    </div>
    <span class="sep"></span>
    <button id="toggle-calc" aria-pressed="false">Montrer le calcul</button>
    <button id="example">Exemple</button>
    <button id="clear">Tout effacer</button>
  </div>
</header>

<main id="stage"><div id="empty">Choisis colonnes × lignes, puis ajoute une grille.</div></main>

<div id="menu" hidden>
  <div class="row">Colonnes
    <span><button data-dim="cols" data-delta="-1" aria-label="Moins de colonnes">−</button> <output data-out="cols"></output> <button data-dim="cols" data-delta="1" aria-label="Plus de colonnes">+</button></span>
  </div>
  <div class="row">Lignes
    <span><button data-dim="rows" data-delta="-1" aria-label="Moins de lignes">−</button> <output data-out="rows"></output> <button data-dim="rows" data-delta="1" aria-label="Plus de lignes">+</button></span>
  </div>
  <div class="row fill-only">Couleur <div class="swatches" id="menu-swatches"></div></div>
  <div class="actions fill-only">
    <button id="menu-fill-all">Tout remplir</button>
    <button id="menu-clear">Vider</button>
  </div>
  <button id="menu-glue" class="base-only">+ Coller une unité à droite</button>
  <button id="menu-delete" class="danger">Supprimer la grille</button>
</div>

<script type="module">
import { customGrid, PALETTE, COLORS } from "./grids.js";

const STORAGE_KEY = "atelier-fractions";
// Grids share one unit size; the SVG pads 1/102 on each side, so touching grids overlap by that.
const STEP = 100 / 102;
const BAR = 0.17;
const SNAP = 0.3;
const GLUE_SNAP = 0.5;
const ROW_Y = (r) => 0.4 + r * 1.5;

const stage = document.getElementById("stage");
const emptyHint = document.getElementById("empty");
const spacer = document.createElement("div");
spacer.id = "spacer";
stage.append(spacer);
let items = load();
let color = PALETTE[0];
let unit = 0;
let topZ = 10;
let nextId = Math.max(0, ...items.map((it) => it.id)) + 1;
const els = new Map();

function load() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) ?? example();
  } catch {
    return example();
  }
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
}

function example() {
  const sevenTenths = [0, 1, 2, 3, 4, 5, 6];
  const fiveHundredths = [7, 17, 27, 37, 47];
  return [
    { id: 1, kind: "base", cols: 10, rows: 10, filled: [], at: { x: 0.25, y: ROW_Y(0) } },
    { id: 2, kind: "fill", cols: 10, rows: 1, filled: sevenTenths, color: PALETTE[0], at: { x: 1.6, y: ROW_Y(0) } },
    { id: 3, kind: "fill", cols: 10, rows: 10, filled: fiveHundredths, color: PALETTE[1], at: { x: 2.95, y: ROW_Y(0) } },
  ];
}

const byId = (id) => items.find((it) => it.id === id);
const bases = () => items.filter((it) => it.kind === "base");

function posOf(it) {
  if (typeof it.at === "number") {
    const base = byId(it.at);
    if (base) return posOf(base);
    it.at = { x: 0.2, y: 0.4 };
  }
  return it.at;
}

const gcd = (a, b) => (b ? gcd(b, a % b) : a);
function addFrac([n1, d1], [n2, d2]) {
  const n = n1 * d2 + n2 * d1;
  const d = d1 * d2;
  const g = gcd(n, d) || 1;
  return [n / g, d / g];
}
const frac = (n, d, c) => `<span class="frac" style="color:${c}"><span>${n}</span><span>${d}</span></span>`;

function groups() {
  const list = bases();
  const parent = new Map(list.map((b) => [b.id, b.id]));
  const find = (id) => (parent.get(id) === id ? id : find(parent.get(id)));
  for (const a of list) {
    for (const b of list) {
      const pa = posOf(a);
      const pb = posOf(b);
      if (Math.abs(pa.y - pb.y) < 1e-6 && Math.abs(pb.x - pa.x - STEP) < 1e-6) parent.set(find(b.id), find(a.id));
    }
  }
  const out = new Map();
  for (const b of list) {
    const root = find(b.id);
    if (!out.has(root)) out.set(root, []);
    out.get(root).push(b);
  }
  return [...out.values()].map((g) => g.sort((a, b) => posOf(a).x - posOf(b).x));
}

function render() {
  emptyHint.hidden = items.length > 0;
  updateSpacer();
  for (const [id, el] of els) {
    if (!byId(id)) {
      el.remove();
      els.delete(id);
    }
  }
  for (const it of items) {
    if (!els.has(it.id)) els.set(it.id, createEl(it));
    drawGrid(it);
    place(it);
  }
  renderLabels();
  save();
}

function createEl(it) {
  const el = document.createElement("div");
  el.className = `item ${it.kind}`;
  el.style.zIndex = it.kind === "base" ? 1 : ++topZ;
  el.innerHTML = `<div class="svg"></div><div class="bar"><span class="grip">⠿</span><span class="text"></span><button class="more" aria-label="Modifier la grille">⋯</button></div>`;
  stage.append(el);
  const more = el.querySelector(".more");
  more.addEventListener("pointerdown", (e) => e.stopPropagation());
  more.addEventListener("click", (e) => {
    e.stopPropagation();
    openMenu(it, more);
  });
  el.querySelector(".bar").addEventListener("pointerdown", (e) => startDrag(e, it));
  if (it.kind === "fill") el.querySelector(".svg").addEventListener("pointerdown", (e) => startPaint(e, it));
  return el;
}

function drawGrid(it) {
  const el = els.get(it.id);
  el.querySelector(".svg").innerHTML = customGrid({
    cols: it.cols,
    rows: it.rows,
    filled: it.filled,
    color: it.color,
    background: it.kind === "base" ? "#fff" : "none",
  });
}

function place(it) {
  const el = els.get(it.id);
  const p = posOf(it);
  el.style.left = `${p.x * unit}px`;
  el.style.top = `${p.y * unit}px`;
  el.style.width = el.style.height = `${unit}px`;
}

function renderLabels() {
  stage.querySelectorAll(".group-label").forEach((n) => n.remove());

  // Fill grids stacked on the same base fan their bars upward so each stays grabbable.
  const stackIndex = new Map();
  for (const it of items) {
    if (it.kind !== "fill") continue;
    const el = els.get(it.id);
    const key = typeof it.at === "number" ? it.at : null;
    const i = key === null ? 0 : (stackIndex.get(key) ?? 0);
    if (key !== null) stackIndex.set(key, i + 1);
    el.style.setProperty("--bar-offset", `${i * BAR * unit}px`);
    el.querySelector(".text").innerHTML = frac(it.filled.length, it.cols * it.rows, it.color);
  }

  for (const group of groups()) {
    const ids = new Set(group.map((b) => b.id));
    const onTop = items.filter((it) => it.kind === "fill" && ids.has(it.at) && it.filled.length);
    const total = onTop.reduce((acc, it) => addFrac(acc, [it.filled.length, it.cols * it.rows]), [0, 1]);
    for (const b of group) {
      const n = b.cols * b.rows;
      els.get(b.id).querySelector(".text").innerHTML = total[0] ? "" : `1 unité = ${frac(n, n, "inherit")}`;
    }
    if (!total[0]) continue;

    const dens = new Set(group.map((b) => b.cols * b.rows));
    let [num, den] = total;
    if (dens.size === 1) {
      const n = [...dens][0];
      if ((num * n) % den === 0) [num, den] = [(num * n) / den, n];
    }
    const first = posOf(group[0]);
    const label = document.createElement("div");
    label.className = "group-label";
    // Whole grids read as units, then the rest from tenths to hundredths, as taught in class.
    const whole = onTop.filter((it) => it.filled.length === it.cols * it.rows);
    const parts = onTop.filter((it) => !whole.includes(it)).sort((x, y) => x.cols * x.rows - y.cols * y.rows);
    const unitColor = new Set(whole.map((it) => it.color)).size === 1 ? whole[0].color : "inherit";
    const terms = [
      ...(whole.length ? [`<span style="color:${unitColor}">${whole.length}</span>`] : []),
      ...parts.map((it) => frac(it.filled.length, it.cols * it.rows, it.color)),
    ].join(" + ");
    label.innerHTML = frac(num, den, COLORS.total) + (showCalc && onTop.length ? ` = ${terms}` : "");
    label.style.left = `${first.x * unit}px`;
    label.style.top = `${(first.y + 1 + BAR) * unit}px`;
    label.style.width = `${(1 + (group.length - 1) * STEP) * unit}px`;
    stage.append(label);
  }
}

// The spacer gives the stage a scrollable size when zoomed grids go past the edges.
function updateSpacer() {
  let maxX = 0;
  let maxY = 0;
  for (const it of items) {
    const p = posOf(it);
    maxX = Math.max(maxX, p.x + 1.3);
    maxY = Math.max(maxY, p.y + 1.6);
  }
  spacer.style.left = `${maxX * unit}px`;
  spacer.style.top = `${maxY * unit}px`;
}

const ZOOM_KEY = "atelier-zoom";
let zoom = Number(localStorage.getItem(ZOOM_KEY)) || 1;

function setZoom(z) {
  zoom = Math.min(3, Math.max(0.4, Math.round(z * 100) / 100));
  localStorage.setItem(ZOOM_KEY, zoom);
  document.getElementById("zoom-reset").textContent = `${Math.round(zoom * 100)} %`;
  layout();
}

document.getElementById("zoom-in").addEventListener("click", () => setZoom(zoom * 1.2));
document.getElementById("zoom-out").addEventListener("click", () => setZoom(zoom / 1.2));
document.getElementById("zoom-reset").addEventListener("click", () => setZoom(1));
// Trackpad pinch arrives as ctrl+wheel.
stage.addEventListener("wheel", (e) => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  setZoom(zoom * Math.exp(-e.deltaY * 0.01));
}, { passive: false });

function layout() {
  unit = zoom * Math.min(stage.clientWidth / 4.4, stage.clientHeight / 3.35);
  stage.style.setProperty("--unit", `${unit}px`);
  stage.style.setProperty("--bar-h", `${BAR * unit}px`);
  render();
}

function freeSpot(kind) {
  const maxX = stage.clientWidth / unit - 1.1;
  for (let r = kind === "base" ? 0 : 1; r < 4; r++) {
    for (let x = 0.2; x <= Math.max(0.2, maxX); x += 1.3) {
      const y = ROW_Y(r);
      const taken = items.some((it) => {
        const p = posOf(it);
        return Math.abs(p.x - x) < 0.9 && Math.abs(p.y - y) < 0.9;
      });
      if (!taken) return { x, y };
    }
  }
  return { x: 0.3 + Math.random(), y: 0.4 + Math.random() };
}

function readSize(input) {
  const v = Math.round(Number(input.value));
  const clamped = Math.max(1, Math.min(20, Number.isFinite(v) ? v : 1));
  input.value = clamped;
  return clamped;
}

function add(kind) {
  const cols = readSize(document.getElementById("cols"));
  const rows = readSize(document.getElementById("rows"));
  items.push({ id: nextId++, kind, cols, rows, filled: [], color: kind === "fill" ? color : undefined, at: freeSpot(kind) });
  render();
}

function remove(id) {
  const gone = byId(id);
  for (const it of items) if (it.at === id) it.at = { ...posOf(gone) };
  items = items.filter((it) => it.id !== id);
  render();
}

function startDrag(e, it) {
  e.preventDefault();
  const el = els.get(it.id);
  el.classList.add("dragging");
  if (it.kind === "fill") el.style.zIndex = ++topZ;
  const from = { ...posOf(it) };
  const start = { x: e.clientX, y: e.clientY };
  // Fill grids sitting on a dragged base travel with it.
  const riders = it.kind === "base" ? items.filter((o) => o.at === it.id) : [];

  const move = (ev) => {
    it.at = { x: from.x + (ev.clientX - start.x) / unit, y: from.y + (ev.clientY - start.y) / unit };
    place(it);
    riders.forEach(place);
    renderLabels();
  };
  const up = () => {
    window.removeEventListener("pointermove", move);
    el.classList.remove("dragging");
    snap(it);
    if (typeof it.at === "object") it.at = { x: Math.max(0, it.at.x), y: Math.max(it.kind === "fill" ? BAR : 0, it.at.y) };
    el.classList.add("animating");
    riders.forEach((r) => els.get(r.id).classList.add("animating"));
    render();
    setTimeout(() => {
      el.classList.remove("animating");
      riders.forEach((r) => els.get(r.id)?.classList.remove("animating"));
    }, 320);
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up, { once: true });
  window.addEventListener("pointercancel", up, { once: true });
}

function snap(it) {
  const p = posOf(it);
  const near = (a, b) => Math.hypot(a.x - b.x, a.y - b.y) < SNAP;
  if (it.kind === "fill") {
    const target = bases().find((b) => near(p, posOf(b)));
    if (target) it.at = target.id;
    return;
  }
  for (const b of bases()) {
    if (b === it) continue;
    const q = posOf(b);
    for (const side of [STEP, -STEP]) {
      const spot = { x: q.x + side, y: q.y };
      const free = !bases().some((o) => o !== it && Math.abs(posOf(o).x - spot.x) < 1e-6 && Math.abs(posOf(o).y - spot.y) < 1e-6);
      if (free && Math.hypot(p.x - spot.x, p.y - spot.y) < GLUE_SNAP) {
        it.at = spot;
        return;
      }
    }
  }
}

function startPaint(e, it) {
  const cell = e.target.closest("[data-cell]");
  if (!cell) return;
  e.preventDefault();
  els.get(it.id).style.zIndex = ++topZ;
  const filled = new Set(it.filled);
  const fill = !filled.has(Number(cell.dataset.cell));
  const apply = (target) => {
    const c = target?.closest?.("[data-cell]");
    if (!c || !els.get(it.id).contains(c)) return;
    const i = Number(c.dataset.cell);
    if (fill === filled.has(i)) return;
    fill ? filled.add(i) : filled.delete(i);
    it.filled = [...filled].sort((a, b) => a - b);
    drawGrid(it);
    renderLabels();
  };
  apply(cell);
  const move = (ev) => apply(document.elementFromPoint(ev.clientX, ev.clientY));
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", () => {
    window.removeEventListener("pointermove", move);
    save();
  }, { once: true });
}

const menu = document.getElementById("menu");
const menuSwatches = document.getElementById("menu-swatches");
let menuItem = null;
let showCalc = false;

const calcBtn = document.getElementById("toggle-calc");
calcBtn.addEventListener("click", () => {
  showCalc = !showCalc;
  calcBtn.setAttribute("aria-pressed", showCalc);
  calcBtn.textContent = showCalc ? "Cacher le calcul" : "Montrer le calcul";
  renderLabels();
});

function openMenu(it, anchor) {
  menuItem = it;
  menu.hidden = false;
  menu.querySelectorAll(".fill-only").forEach((n) => (n.hidden = it.kind !== "fill"));
  menu.querySelectorAll(".base-only").forEach((n) => (n.hidden = it.kind !== "base"));
  refreshMenu();
  const a = anchor.getBoundingClientRect();
  const m = menu.getBoundingClientRect();
  const below = a.bottom + 6;
  const top = below + m.height <= innerHeight - 8 ? below : a.top - m.height - 6;
  menu.style.left = `${Math.max(8, Math.min(a.right - m.width, innerWidth - m.width - 8))}px`;
  menu.style.top = `${Math.max(8, Math.min(top, innerHeight - m.height - 8))}px`;
}

function refreshMenu() {
  const it = menuItem;
  menu.querySelector('[data-out="cols"]').textContent = it.cols;
  menu.querySelector('[data-out="rows"]').textContent = it.rows;
  menuSwatches.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.color === it.color));
}

function closeMenu() {
  menu.hidden = true;
  menuItem = null;
}

// Keeps colored cells at the same row/column when the grid is resized.
function resize(it, cols, rows) {
  it.filled = it.filled
    .map((i) => [Math.floor(i / it.cols), i % it.cols])
    .filter(([r, c]) => r < rows && c < cols)
    .map(([r, c]) => r * cols + c);
  it.cols = cols;
  it.rows = rows;
}

menu.querySelectorAll("[data-dim]").forEach((btn) => {
  btn.addEventListener("click", () => {
    const it = menuItem;
    const next = { cols: it.cols, rows: it.rows };
    next[btn.dataset.dim] = Math.max(1, Math.min(20, next[btn.dataset.dim] + Number(btn.dataset.delta)));
    resize(it, next.cols, next.rows);
    refreshMenu();
    render();
  });
});
for (const c of PALETTE) {
  const b = document.createElement("button");
  b.style.background = c;
  b.dataset.color = c;
  b.setAttribute("aria-label", "Couleur");
  b.addEventListener("click", () => {
    menuItem.color = c;
    refreshMenu();
    render();
  });
  menuSwatches.append(b);
}
document.getElementById("menu-fill-all").addEventListener("click", () => {
  menuItem.filled = Array.from({ length: menuItem.cols * menuItem.rows }, (_, i) => i);
  render();
});
document.getElementById("menu-clear").addEventListener("click", () => {
  menuItem.filled = [];
  render();
});
document.getElementById("menu-glue").addEventListener("click", () => {
  const group = groups().find((g) => g.includes(menuItem));
  const last = posOf(group.at(-1));
  items.push({ id: nextId++, kind: "base", cols: menuItem.cols, rows: menuItem.rows, filled: [], at: { x: last.x + STEP, y: last.y } });
  closeMenu();
  render();
});
document.getElementById("menu-delete").addEventListener("click", () => {
  const id = menuItem.id;
  closeMenu();
  remove(id);
});
document.addEventListener("pointerdown", (e) => {
  if (!menu.hidden && !menu.contains(e.target)) closeMenu();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeMenu();
});

const swatches = document.getElementById("swatches");
for (const c of PALETTE) {
  const b = document.createElement("button");
  b.style.background = c;
  b.setAttribute("aria-label", "Couleur");
  b.setAttribute("aria-pressed", c === color);
  b.addEventListener("click", () => {
    color = c;
    swatches.querySelectorAll("button").forEach((s) => s.setAttribute("aria-pressed", s === b));
  });
  swatches.append(b);
}

document.getElementById("add-base").addEventListener("click", () => add("base"));
document.getElementById("add-fill").addEventListener("click", () => add("fill"));
document.getElementById("example").addEventListener("click", () => {
  items = example();
  nextId = 4;
  render();
});
document.getElementById("clear").addEventListener("click", () => {
  if (!confirm("Effacer toutes les grilles ?")) return;
  items = [];
  render();
});

window.addEventListener("resize", layout);
setZoom(zoom);
</script>
